name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  native-macos:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - run: swift test
      - run: swift build --product Reality
      - run: swift format lint --recursive Sources Tests Package.swift

  web-prototype:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: prototype/web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: prototype/web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm audit --omit=dev
