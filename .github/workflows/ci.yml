name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  web-prototype:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: prototype/web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: prototype/web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm audit --omit=dev
